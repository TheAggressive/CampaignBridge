# Routine dependency maintenance follows the same guarded policy as the other
# Aggressive WordPress repositories: grouped, cooled down, and non-major.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github_actions
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - php
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # WordPress core, its PHPUnit library, and public stubs move together
      # after the target core archive passes checksum verification.
      - dependency-name: wp-phpunit/wp-phpunit
      - dependency-name: php-stubs/wordpress-stubs
    groups:
      php-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - javascript
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # These packages form the production CSS compatibility stack documented
      # in docs/dependency-policy.md. Upgrade them together after a clean build.
      - dependency-name: '@tailwindcss/postcss'
      - dependency-name: tailwindcss
      - dependency-name: postcss-lightningcss
      - dependency-name: postcss-nested
    groups:
      wordpress:
        patterns: ['@wordpress/*']
        update-types: [minor, patch]
      js-tooling:
        patterns: ['*']
        exclude-patterns: ['@wordpress/*']
        update-types: [minor, patch]
