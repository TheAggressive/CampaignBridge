# Routine dependency maintenance is grouped and checked weekly.
# Version-update rules exclude majors without suppressing security fixes that
# may need to cross a major version.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github_actions
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine-actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-actions:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - php
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # WordPress core, its PHPUnit library, and public stubs move together
      # after the target core archive passes checksum verification.
      - dependency-name: wp-phpunit/wp-phpunit
      - dependency-name: php-stubs/wordpress-stubs
    groups:
      php-tooling:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - javascript
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # These packages form the production CSS compatibility stack documented
      # in docs/dependency-policy.md. Upgrade them together after a clean build.
      - dependency-name: '@tailwindcss/postcss'
      - dependency-name: tailwindcss
      - dependency-name: postcss-lightningcss
      - dependency-name: postcss-nested
    groups:
      wordpress:
        applies-to: version-updates
        patterns: ['@wordpress/*']
        update-types: [minor, patch]
      js-tooling:
        applies-to: version-updates
        patterns: ['*']
        exclude-patterns: ['@wordpress/*']
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ['*']
