name: PHP Forward Compatibility

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  WP_VERSION: '7.0.4'

jobs:
  forward:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campaignbridge_test
          MYSQL_USER: campaignbridge
          MYSQL_PASSWORD: campaignbridge
          MYSQL_ROOT_PASSWORD: campaignbridge-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcampaignbridge-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, xml
          tools: composer:v2

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install checksum-verified WordPress core
        env:
          CB_TESTS_WP_VERSION: ${{ env.WP_VERSION }}
          CB_TESTS_WP_DIR: ${{ runner.temp }}/wordpress
        run: bash bin/ci/install-wp-core.sh

      - name: Run all PHP suites
        env:
          CB_TESTS_ABSPATH: ${{ runner.temp }}/wordpress
          CB_TESTS_PLUGIN_DIR: ${{ github.workspace }}/..
          CB_TESTS_DB_HOST: 127.0.0.1:3306
          CB_TESTS_DB_NAME: campaignbridge_test
          CB_TESTS_DB_USER: campaignbridge
          CB_TESTS_DB_PASSWORD: campaignbridge
          WP_PHPUNIT__TESTS_CONFIG: ${{ github.workspace }}/tests/wp-tests-config.php
        run: vendor/bin/phpunit
