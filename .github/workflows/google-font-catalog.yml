name: Google Fonts Catalog

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: google-font-catalog
  cancel-in-progress: false

jobs:
  update:
    name: Propose catalog update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
      - name: Refresh and verify catalog
        run: |
          node bin/build-google-font-catalog.mjs --latest
          node --test bin/ci/google-font-catalog.test.mjs
      - name: Open reviewable update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/google-font-catalog
          delete-branch: true
          sign-commits: true
          commit-message: 'chore: update Google Fonts catalog'
          title: 'chore: update Google Fonts catalog'
          body: |
            Automated weekly refresh from the pinned Google Fonts upstream commit.

            Review the provenance, family-count change, and generated catalog diff.
          labels: dependencies
