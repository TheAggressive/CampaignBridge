name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after every quality gate passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_SLUG: campaignbridge
  NODE_VERSION: '24.18.1'
  PNPM_VERSION: '11.1.2'
  PHP_VERSION: '8.2'
  WP_VERSION: '7.0.4'

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile

      - name: Verify dependencies and workflow policy
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-interaction
          pnpm audit --prod --audit-level moderate
          pnpm lint:files

      - name: Check PHP
        run: |
          find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l campaignbridge.php
          php -l uninstall.php
          pnpm lint:php
          pnpm phpstan

      - name: Check JavaScript and TypeScript
        run: |
          pnpm lint:js
          pnpm typecheck
          pnpm format:check

  phpunit:
    name: PHPUnit (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, security, accessibility, performance]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campaignbridge_test
          MYSQL_USER: campaignbridge
          MYSQL_PASSWORD: campaignbridge
          MYSQL_ROOT_PASSWORD: campaignbridge-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcampaignbridge-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, mbstring, xml
          tools: composer:v2

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install checksum-verified WordPress core
        env:
          CB_TESTS_WP_VERSION: ${{ env.WP_VERSION }}
          CB_TESTS_WP_DIR: ${{ runner.temp }}/wordpress
        run: bash bin/ci/install-wp-core.sh

      - name: Run ${{ matrix.suite }} suite
        env:
          CB_TESTS_ABSPATH: ${{ runner.temp }}/wordpress
          CB_TESTS_PLUGIN_DIR: ${{ github.workspace }}/..
          CB_TESTS_DB_HOST: 127.0.0.1:3306
          CB_TESTS_DB_NAME: campaignbridge_test
          CB_TESTS_DB_USER: campaignbridge
          CB_TESTS_DB_PASSWORD: campaignbridge
          WP_PHPUNIT__TESTS_CONFIG: ${{ github.workspace }}/tests/wp-tests-config.php
        run: vendor/bin/phpunit --testsuite=${{ matrix.suite }}

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-${{ matrix.suite }}
          path: coverage/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build assets
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campaignbridge_e2e
          MYSQL_USER: campaignbridge
          MYSQL_PASSWORD: campaignbridge
          MYSQL_ROOT_PASSWORD: campaignbridge-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcampaignbridge-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: dist

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install browser dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Install disposable WordPress site
        env:
          CB_TESTS_WP_VERSION: ${{ env.WP_VERSION }}
          CB_TESTS_WP_DIR: ${{ runner.temp }}/wordpress
          CB_TESTS_TOOL_DIR: ${{ runner.temp }}/campaignbridge-tools
        run: |
          bash bin/ci/install-wp-core.sh

          wp_cli="${RUNNER_TEMP}/campaignbridge-tools/wp"
          wp_dir="${RUNNER_TEMP}/wordpress"
          php "${wp_cli}" --path="${wp_dir}" config create \
            --dbname=campaignbridge_e2e \
            --dbuser=campaignbridge \
            --dbpass=campaignbridge \
            --dbhost=127.0.0.1:3306 \
            --skip-check \
            --skip-salts
          php "${wp_cli}" --path="${wp_dir}" core install \
            --url=http://127.0.0.1:8889 \
            --title=CampaignBridge-E2E \
            --admin_user=campaignbridge \
            --admin_password=campaignbridge-e2e \
            --admin_email=admin@example.test \
            --skip-email

          mkdir -p "${wp_dir}/wp-content/plugins"
          ln -s "${GITHUB_WORKSPACE}" "${wp_dir}/wp-content/plugins/campaignbridge"
          php "${wp_cli}" --path="${wp_dir}" plugin activate campaignbridge

      - name: Start WordPress web server
        run: |
          php -S 127.0.0.1:8889 -t "${RUNNER_TEMP}/wordpress" \
            > "${RUNNER_TEMP}/campaignbridge-e2e-server.log" 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8889/wp-login.php > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo 'WordPress E2E server did not become ready.' >&2
          exit 1

      - name: Run browser tests
        env:
          CB_E2E_BASE_URL: http://127.0.0.1:8889
          CB_E2E_ADMIN_USER: campaignbridge
          CB_E2E_ADMIN_PASSWORD: campaignbridge-e2e
        run: pnpm test:e2e:ci

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e
          path: |
            playwright-report/
            test-results/playwright/
            ${{ runner.temp }}/campaignbridge-e2e-server.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package plugin
    runs-on: ubuntu-24.04
    needs: [build, phpunit]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: dist

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and verify allowlisted package
        run: |
          bash bin/release/package.sh
          bash bin/release/verify-package.sh

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PLUGIN_SLUG }}-package
          path: release/${{ env.PLUGIN_SLUG }}-*.zip*
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: package
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/master'
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.publish.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] semantic-release needs the credential in
          # this isolated publishing job to create the verified release tag.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish semantic release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: |
          pnpm install --frozen-lockfile
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pnpm semantic-release

          VERSION=$(node -p "require('./package.json').version")
          TAG_SHA=$(git rev-list -n 1 "v${VERSION}" 2>/dev/null || true)
          HEAD_SHA=$(git rev-parse HEAD)

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ -n "${TAG_SHA}" && "${TAG_SHA}" == "${HEAD_SHA}" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve tracked release metadata
        if: steps.publish.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.run_id }}
          path: |
            CHANGELOG.md
            package.json
            campaignbridge.php
          retention-days: 7

      - name: Build and attach released package
        if: steps.publish.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm build
          bash bin/release/package.sh "${VERSION}"
          bash bin/release/verify-package.sh "${VERSION}"
          gh release upload "v${VERSION}" \
            "release/${{ env.PLUGIN_SLUG }}-${VERSION}.zip" \
            "release/${{ env.PLUGIN_SLUG }}-${VERSION}.zip.sha256" \
            --clobber

  version-sync:
    name: Sync released version
    runs-on: ubuntu-24.04
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.released == 'true'
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata-${{ github.run_id }}
          path: .
      - name: Mint a repository-scoped CI App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AA_CI_CLIENT_ID }}
          private-key: ${{ secrets.AA_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open a signed version-sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          add-paths: |
            CHANGELOG.md
            package.json
            campaignbridge.php
          branch: chore/version-sync
          delete-branch: true
          commit-message: 'chore(release): sync version to ${{ needs.release.outputs.version }}'
          title: 'chore(release): sync version to ${{ needs.release.outputs.version }}'
          body: |
            Automated follow-up to **v${{ needs.release.outputs.version }}**.

            The published artifact was built from these version declarations.
            This signed pull request brings the protected source branch back in
            sync without granting release automation a protection bypass.
      - name: Register native squash auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          number="$(gh pr list --head chore/version-sync --state open \
            --json number --jq '.[0].number // empty')"

          if [[ -z "${number}" ]]; then
            echo "No version-sync pull request was opened."
            exit 0
          fi

          gh pr merge "${number}" --auto --squash --delete-branch
          echo "Version sync #${number} will merge after every required check passes."

  summary:
    name: CI summary
    runs-on: ubuntu-24.04
    needs: [quality, phpunit, build, e2e, package, release, version-sync]
    if: always()

    steps:
      - name: Record gate results
        run: |
          {
            echo '## CI/CD results'
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| Quality | ${{ needs.quality.result }} |'
            echo '| PHPUnit | ${{ needs.phpunit.result }} |'
            echo '| Build | ${{ needs.build.result }} |'
            echo '| Browser E2E | ${{ needs.e2e.result }} |'
            echo '| Package | ${{ needs.package.result }} |'
            echo '| Release | ${{ needs.release.result }} |'
            echo '| Version sync | ${{ needs.version-sync.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required gates
        if: >-
          needs.quality.result != 'success' ||
          needs.phpunit.result != 'success' ||
          needs.build.result != 'success' ||
          needs.e2e.result != 'success' ||
          needs.package.result != 'success' ||
          (needs.release.result != 'success' && needs.release.result != 'skipped') ||
          (needs.version-sync.result != 'success' && needs.version-sync.result != 'skipped')
        run: exit 1
