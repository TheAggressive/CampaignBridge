name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after every quality gate passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_SLUG: campaignbridge
  NODE_VERSION: '22'
  PNPM_VERSION: '11.1.2'
  PHP_VERSION: '8.2'
  WP_VERSION: '6.8.2'

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile

      - name: Verify dependencies and workflow policy
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-interaction
          pnpm audit --prod --audit-level moderate
          bash bin/ci/check-action-pins.sh
          bash bin/ci/check-file-length.sh
          bash bin/ci/check-repository-boundary.sh

      - name: Check PHP
        run: |
          find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l campaignbridge.php
          php -l uninstall.php
          pnpm lint:php
          pnpm phpstan

      - name: Check JavaScript and TypeScript
        run: |
          pnpm lint:js
          pnpm typecheck
          pnpm format:check

  phpunit:
    name: PHPUnit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, security, accessibility, performance]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campaignbridge_test
          MYSQL_USER: campaignbridge
          MYSQL_PASSWORD: campaignbridge
          MYSQL_ROOT_PASSWORD: campaignbridge-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcampaignbridge-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, mbstring, xml
          tools: composer:v2

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install checksum-verified WordPress core
        env:
          CB_TESTS_WP_VERSION: ${{ env.WP_VERSION }}
          CB_TESTS_WP_DIR: ${{ runner.temp }}/wordpress
        run: bash bin/ci/install-wp-core.sh

      - name: Run ${{ matrix.suite }} suite
        env:
          CB_TESTS_ABSPATH: ${{ runner.temp }}/wordpress
          CB_TESTS_PLUGIN_DIR: ${{ github.workspace }}/..
          CB_TESTS_DB_HOST: 127.0.0.1:3306
          CB_TESTS_DB_NAME: campaignbridge_test
          CB_TESTS_DB_USER: campaignbridge
          CB_TESTS_DB_PASSWORD: campaignbridge
          WP_PHPUNIT__TESTS_CONFIG: ${{ github.workspace }}/tests/wp-tests-config.php
        run: vendor/bin/phpunit --testsuite=${{ matrix.suite }}

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phpunit-${{ matrix.suite }}
          path: coverage/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build assets
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  package:
    name: Package plugin
    runs-on: ubuntu-latest
    needs: [build, phpunit]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: dist

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and verify allowlisted package
        run: |
          bash bin/release/package.sh
          bash bin/release/verify-package.sh

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PLUGIN_SLUG }}-package
          path: release/${{ env.PLUGIN_SLUG }}-*.zip*
          retention-days: 30

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: package
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: |
          pnpm install --frozen-lockfile
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pnpm semantic-release

      - name: Build and attach released package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          pnpm build
          bash bin/release/package.sh "${VERSION}"
          bash bin/release/verify-package.sh "${VERSION}"
          gh release upload "v${VERSION}" \
            "release/${{ env.PLUGIN_SLUG }}-${VERSION}.zip" \
            "release/${{ env.PLUGIN_SLUG }}-${VERSION}.zip.sha256" \
            --clobber

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [quality, phpunit, build, package]
    if: always()

    steps:
      - name: Record gate results
        run: |
          {
            echo '## CI/CD results'
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo '| Quality | ${{ needs.quality.result }} |'
            echo '| PHPUnit | ${{ needs.phpunit.result }} |'
            echo '| Build | ${{ needs.build.result }} |'
            echo '| Package | ${{ needs.package.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce required gates
        if: >-
          needs.quality.result != 'success' ||
          needs.phpunit.result != 'success' ||
          needs.build.result != 'success' ||
          needs.package.result != 'success'
        run: exit 1
